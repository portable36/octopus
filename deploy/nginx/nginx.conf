# Octopus origin reverse proxy — NestJS API + SEO surfaces.
# Place behind Cloudflare (or terminate TLS on-host with the HTTPS server below).
# Upstream matches Nest PORT default (3000). For docker-compose.prod.yml (API :4000),
# change the upstream server line accordingly.
#
# Install (example): copy to /etc/nginx/nginx.conf (or include from sites-enabled),
# then: nginx -t && systemctl reload nginx

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  # --- Gzip (sitemaps + JSON APIs) ---
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/xml
    application/xml+rss
    application/json
    application/javascript
    application/rss+xml
    application/atom+xml
    image/svg+xml;

  # --- API scrape / surge throttle (not applied to sitemap/robots) ---
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_status 429;

  upstream nest_backend {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  # Shared proxy settings for Nest locations
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # HTTP → HTTPS redirect (ACME challenge path left open for certbot)
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Replace with your Let's Encrypt (or other) certificate paths.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Strict headers for API / XML origin (not the Next.js storefront CSP).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Rate-limited API
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://nest_backend;
    }

    # SEO surfaces — gzip applies; no API rate zone (crawler-friendly)
    location = /robots.txt {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_pass http://nest_backend;
    }

    location = /sitemap.xml {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_pass http://nest_backend;
    }

    location /sitemaps/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_pass http://nest_backend;
    }

    # Do not expose Nest as a catch-all HTML app on this vhost.
    location / {
      return 444;
    }
  }
}
