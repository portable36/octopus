x-octopus-app-env: &octopus-app-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://octopus:octopus@postgres:5432/octopus
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-me-to-a-random-32-plus-character-secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_API_KEY: masterKey
  SEARCH_PRODUCTS_INDEX: products
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: octopus-media
  CORS_ORIGINS: http://localhost:3001
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT_MS: 10000
  OUTBOX_DISPATCH_ENABLED: 'true'
  SEO_PUBLIC_SITE_URL: http://localhost:3001
  SEO_CACHE_DIR: .cache/seo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U octopus -d octopus']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: masterKey
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  web-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: octopus:prod
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'false'
    ports:
      - '3000:3000'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  seo-worker:
    image: octopus:prod
    command: ['node', 'dist/workers/seo-discovery-worker.main.js']
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'true'
      OUTBOX_DISPATCH_ENABLED: 'false'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-backend:
        condition: service_healthy

volumes:
  pgdata:
  meilidata:
  miniodata:
  seo-cache:
