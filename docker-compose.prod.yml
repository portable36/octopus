# Production / staging matrix — Hostinger VPS, DigitalOcean, or AWS verification loops.
# Local dev infra only: docker compose up (see docker-compose.yml).
#
# Build:  docker compose -f docker-compose.prod.yml build
# Start:  docker compose -f docker-compose.prod.yml up -d
#
# Required: copy backend/.env.production.template values into a root `.env` file
# (or export secrets in your orchestrator) before first boot.

x-octopus-app-env: &octopus-app-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://octopus:octopus@postgres:5432/octopus
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-me-to-a-random-32-plus-character-secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_API_KEY: masterKey
  SEARCH_PRODUCTS_INDEX: products
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: octopus-media
  CORS_ORIGINS: http://localhost:3001
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT_MS: 10000
  OUTBOX_DISPATCH_ENABLED: 'true'
  SEO_PUBLIC_SITE_URL: https://shop.example.com
  SEO_CACHE_DIR: .cache/seo
  SEO_CACHE_TTL_SECONDS: '86400'
  SITEMAP_ITEMS_PER_CHUNK: '5000'
  META_PIXEL_ID: '123456789012345'
  META_ACCESS_TOKEN: replace-with-meta-system-user-token
  META_ANDROMEDA_DATA_PROCESSING_OPTIONS: '["LDU"]'
  META_ANDROMEDA_COUNTRY: '1'
  META_ANDROMEDA_STATE: '0'
  META_CAPI_DATA_SOURCE: server
  GEM_SCHEMA_VERSION: 2.4.0
  GEM_TRACKING_ENVIRONMENT: production
  GOOGLE_SERVICES_CLIENT_EMAIL: seo-automation@project.iam.gserviceaccount.com
  GOOGLE_SERVICES_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nREPLACE\n-----END PRIVATE KEY-----\n"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U octopus -d octopus']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    image: octopus:prod
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'start', '-w', 'backend']
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'false'
    ports:
      - '4000:4000'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  seo-worker:
    image: octopus:prod
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'start:seo-worker', '-w', 'backend']
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'true'
      OUTBOX_DISPATCH_ENABLED: 'false'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  seo-cache:
