# Production / staging matrix — Hostinger VPS, DigitalOcean, or local verification.
# Local infra-only deps: docker compose up (see docker-compose.yml).
#
# Build:  docker compose -f docker-compose.prod.yml build
# Start:  docker compose -f docker-compose.prod.yml up -d
# Logs:   docker compose -f docker-compose.prod.yml logs -f backend-api seo-worker frontend-store
#
# Secrets: copy deploy/host.secrets.env.example → `.env` (or `host.secrets.env`) next to
# this file on the host (`chmod 600`). Compose interpolates `${VAR}` from `.env`; app
# services also load optional `host.secrets.env` when present. Never commit real values.

x-octopus-app-env: &octopus-app-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: ${DATABASE_URL:-postgresql://octopus_app:octopus_app@postgres:5432/octopus}
  DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:-postgresql://octopus:octopus@postgres:5432/octopus}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-plus-character-secret}
  JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-masterKey}
  SEARCH_PRODUCTS_INDEX: ${SEARCH_PRODUCTS_INDEX:-products}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-octopus-media}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  OUTBOX_DISPATCH_ENABLED: ${OUTBOX_DISPATCH_ENABLED:-true}
  SEO_PUBLIC_SITE_URL: ${SEO_PUBLIC_SITE_URL:-https://shop.example.com}
  SEO_CACHE_DIR: .cache/seo
  SEO_CACHE_TTL_SECONDS: '86400'
  SITEMAP_ITEMS_PER_CHUNK: '5000'
  META_PIXEL_ID: ${META_PIXEL_ID:-123456789012345}
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-replace-with-meta-system-user-token}
  META_ANDROMEDA_DATA_PROCESSING_OPTIONS: ${META_ANDROMEDA_DATA_PROCESSING_OPTIONS:-["LDU"]}
  META_ANDROMEDA_COUNTRY: ${META_ANDROMEDA_COUNTRY:-1}
  META_ANDROMEDA_STATE: ${META_ANDROMEDA_STATE:-0}
  META_CAPI_DATA_SOURCE: ${META_CAPI_DATA_SOURCE:-server}
  GEM_SCHEMA_VERSION: ${GEM_SCHEMA_VERSION:-2.4.0}
  GEM_TRACKING_ENVIRONMENT: ${GEM_TRACKING_ENVIRONMENT:-production}
  GOOGLE_SERVICES_CLIENT_EMAIL: ${GOOGLE_SERVICES_CLIENT_EMAIL:-seo-automation@project.iam.gserviceaccount.com}
  GOOGLE_SERVICES_PRIVATE_KEY: ${GOOGLE_SERVICES_PRIVATE_KEY:-"-----BEGIN PRIVATE KEY-----\nREPLACE\n-----END PRIVATE KEY-----\n"}
  SENTRY_DSN: ${SENTRY_DSN:-}
  PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-live}
  PAYMENT_IPN_HMAC_SECRET: ${PAYMENT_IPN_HMAC_SECRET:-local-prod-ipn-hmac-secret!!}
  STEADFAST_WEBHOOK_SECRET: ${STEADFAST_WEBHOOK_SECRET:-local-steadfast-webhook-secret}
  PATHAO_WEBHOOK_SECRET: ${PATHAO_WEBHOOK_SECRET:-local-pathao-webhook-secret}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    volumes:
      # PG 18+ images expect the mount at /var/lib/postgresql (versioned data dir underneath).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U octopus -d octopus']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: ${OCTOPUS_IMAGE:-octopus:prod}
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'start', '-w', 'backend']
    env_file:
      - path: host.secrets.env
        required: false
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'false'
    ports:
      - '4000:4000'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  seo-worker:
    image: ${OCTOPUS_IMAGE:-octopus:prod}
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'start:seo-worker', '-w', 'backend']
    env_file:
      - path: host.secrets.env
        required: false
    environment:
      <<: *octopus-app-env
      SEO_DISCOVERY_WORKER_ENABLED: 'true'
      OUTBOX_DISPATCH_ENABLED: 'false'
    volumes:
      - seo-cache:/app/backend/.cache/seo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  frontend-store:
    image: ${OCTOPUS_IMAGE:-octopus:prod}
    restart: unless-stopped
    working_dir: /app
    command: ['npm', 'run', 'start', '-w', 'frontend']
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3000:3000'
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  seo-cache:
